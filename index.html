<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GitHub ingestion progress</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
  body { font-family: system-ui, sans-serif; margin: 0 auto; max-width: 1100px; padding: 1rem; }
  #status { color: #666; font-size: .9rem; margin-bottom: .5rem; }
  #status.error { color: #b00020; }
</style>
</head>
<body>
<h1>GitHub ingestion pipeline — progress</h1>
<div id="status">Loading…</div>
<div id="origins"></div>
<div id="disk"></div>
<script>
//s __DATA_URL__ is substituted by the deploy workflow with
// https://raw.githubusercontent.com/<owner>/<repo>/<data branch>/stats.json
// (override with ?src=<url> for local testing).
const DATA_URL = new URLSearchParams(location.search).get("src") || "__DATA_URL__";
const POLL_MS = 60_000;

const SERIES = [
  ["download_success", "Downloaded: success"],
  ["download_failed", "Downloaded: failed"],
  ["download_skipped", "Downloaded: skipped (pending retry)"],
  ["ingest_success", "Ingested: success"],
  ["ingest_failed", "Ingested: failed"],
];

function humanBytes(n) {
  for (const u of ["B", "KB", "MB", "GB", "TB"]) {
    if (Math.abs(n) < 1024) return n.toFixed(1) + " " + u;
    n /= 1024;
  }
  return n.toFixed(1) + " PB";
}

function render(data) {
  const rows = data.rows;
  const x = rows.map(r => r.timestamp);
  const traces = SERIES.map(([key, name]) => ({
    x, y: rows.map(r => r[key]), name, mode: "lines+markers", type: "scatter",
  }));
  const shapes = [], annotations = [];
  if (data.total_origins) {
    shapes.push({ type: "line", xref: "paper", x0: 0, x1: 1,
                  y0: data.total_origins, y1: data.total_origins,
                  line: { dash: "dash", color: "black" } });
    annotations.push({ xref: "paper", x: 0, y: data.total_origins, yanchor: "bottom",
                       showarrow: false,
                       text: "Total origins to process: " + data.total_origins });
  }
  Plotly.react("origins", traces, {
    title: "Origin progress (cumulative)", yaxis: { title: "Origins" },
    shapes, annotations, legend: { orientation: "h", y: 1.15 },
  });

  const bytes = rows.map(r => r.cumulative_bytes);
  Plotly.react("disk", [{
    x, y: bytes, name: "ORC/Parquet bytes written", mode: "lines+markers", type: "scatter",
    text: bytes.map(humanBytes), hovertemplate: "%{x}<br>%{text}<extra></extra>",
  }], { title: "ORC/Parquet disk usage (cumulative)", yaxis: { title: "Bytes" } });
}

async function refresh() {
  const status = document.getElementById("status");
  try {
    // The query string defeats the raw.githubusercontent.com CDN cache key
    // only partially: expect up to ~5 minutes of lag.
    const resp = await fetch(DATA_URL + "?t=" + Date.now(), { cache: "no-store" });
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    const data = await resp.json();
    render(data);
    status.className = "";
    status.textContent = "Data generated " + data.generated_at +
      " · page refreshed " + new Date().toLocaleTimeString();
  } catch (err) {
    status.className = "error";
    status.textContent = "Could not load stats: " + err.message + " (will retry)";
  }
}

refresh();
setInterval(refresh, POLL_MS);
</script>
</body>
</html>
